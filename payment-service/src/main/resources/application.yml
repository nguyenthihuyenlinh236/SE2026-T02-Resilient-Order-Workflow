server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/payment_db
    username: ${POSTGRES_USER:workflow}
    password: ${POSTGRES_PASSWORD:workflow_local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:workflow}
    password: ${RABBITMQ_PASSWORD:workflow_local}

payment:
  mock:
    outcome: ${PAYMENT_MOCK_OUTCOME:IN_PROGRESS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
