services:
  postgres:
    image: postgres:16-alpine
    container_name: resilient-order-postgres
    environment:
      POSTGRES_DB: resilient_orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d resilient_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
