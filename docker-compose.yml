services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow_local}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U "$$POSTGRES_USER" -d order_db -c 'SELECT 1' >/dev/null &&
          psql -U "$$POSTGRES_USER" -d inventory_db -c 'SELECT 1' >/dev/null &&
          psql -U "$$POSTGRES_USER" -d payment_db -c 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-workflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-workflow_local}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
