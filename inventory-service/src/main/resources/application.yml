server:
  port: ${INVENTORY_SERVICE_PORT:8082}

spring:
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inventory_db
    username: ${POSTGRES_USER:workflow}
    password: ${POSTGRES_PASSWORD:workflow_local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:workflow}
    password: ${RABBITMQ_PASSWORD:workflow_local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
