spring:
  application:
    name: resilient-order-workflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resilient_orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  order:
    ttl: ${ORDER_TTL:15m}
  workers:
    saga-delay: ${SAGA_WORKER_DELAY:1000}
    expiration-delay: ${EXPIRATION_WORKER_DELAY:5000}
    outbox-delay: ${OUTBOX_WORKER_DELAY:1000}
  payment:
    simulated-outcome: ${PAYMENT_SIMULATED_OUTCOME:SUCCEEDED}
